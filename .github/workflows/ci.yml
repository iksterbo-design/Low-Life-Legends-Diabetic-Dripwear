name: Dripwear CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs on new pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JS syntax (node)
        run: |
          for f in $(find js -name '*.js'); do
            node --check "$f" || exit 1
          done
          echo "JS syntax OK"

      - name: HTML sanity (no unclosed tags heuristic)
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          # quick self-closing sanity: count <tag> vs </tag> for a few keys
          for tag in ['div', 'section', 'button', 'script', 'svg', 'span', 'ul', 'li', 'a', 'header', 'footer']:
              open_ = len(re.findall(rf'<{tag}[>\s]', html))
              close_ = len(re.findall(rf'</{tag}>', html))
              if tag in ('script','svg','br','img','input','meta','link','hr'):
                  continue
              if open_ < close_:
                  print(f'WARN: <{tag}> count {open_} < close <{tag}> {close_}')
          print('HTML sanity check done')
          PY

      - name: Node module resolution
        run: |
          node -e "require('./js/store.js'); require('./js/app.js'); console.log('module load OK')"

  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Generate PWA icons
        run: python3 scripts/generate-icons.py

      - name: List build artifact
        run: |
          find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.png' -o -name '*.webmanifest' -o -name '*.svg' \) -not -path './.git/*' | sort

      - name: Pack release ZIP (Python zipfile)
        run: |
          set -e
          python3 - "${GITHUB_WORKSPACE}" <<'PY'
          import os, shutil, zipfile, sys
          root = os.path.abspath(sys.argv[1])
          dist = os.path.join(root, 'Low-Life-Legends-Diabetic-Dripwear-dist')
          if os.path.exists(dist):
              shutil.rmtree(dist)
          shutil.copytree(root, dist, ignore=shutil.ignore_patterns('.git', '*.DS_Store', '__pycache__', 'node_modules'))
          zip_path = os.path.join(dist, 'dripwear.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
              for dirpath, dirnames, filenames in os.walk(dist):
                  for fn in filenames:
                      full = os.path.join(dirpath, fn)
                      arc = os.path.relpath(full, dist)
                      z.write(full, arc)
          print('Packed', zip_path, os.path.getsize(zip_path), 'bytes')
          PY
          ls -la Low-Life-Legends-Diabetic-Dripwear-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dripwear-dist
          path: Low-Life-Legends-Diabetic-Dripwear-dist/dripwear.zip
          if-no-files-found: error
